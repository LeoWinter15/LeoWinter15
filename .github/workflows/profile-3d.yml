name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Daily at 16:17 UTC; avoid the busiest start-of-hour period.
    - cron: "17 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/profile-3d.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-3d-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Check out pinned calendar generator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: yoshi389111/github-profile-3d-contrib
          ref: 7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
          path: .profile-generator
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Customize and compile generator
        run: |
          python3 scripts/customize-generator.py .profile-generator
          npm ci --ignore-scripts --no-audit --no-fund --prefix .profile-generator
          npm run tsc --prefix .profile-generator

      - name: Verify six-month range and chart layout
        run: node scripts/check-profile.cjs .profile-generator

      - name: Generate six-month contribution calendars
        run: node .profile-generator/dist0/src/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push updated calendars
        shell: bash
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-night-rainbow.svg
          test -s profile-3d-contrib/profile-season-animate.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/profile-night-rainbow.svg profile-3d-contrib/profile-season-animate.svg
          if git diff --cached --quiet; then
            echo "Contribution calendars are unchanged."
            exit 0
          fi
          git commit -m "chore: update 3D contribution calendars"
          git pull --rebase origin main
          git push origin HEAD:main
