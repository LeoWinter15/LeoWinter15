  <rect x="1" y="1" width="848" height="178" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="40" y="66" fill="#0969da" font-family="sans-serif" font-size="14" font-weight="600">LEOWINTER15 / GITHUB ACTIVITY</text>
  <text x="40" y="105" fill="#1f2328" font-family="sans-serif" font-size="25" font-weight="600">Contribution calendar</text>
  <text x="40" y="138" fill="#59636e" font-family="sans-serif" font-size="16">Awaiting the first update.</text>
</svg>
